name: api-gibtalk tests

on:
  pull_request:
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      # Includes search quality (Malay/Spanish floors) and the check that no
      # served picture is renamed or removed.
      - run: cargo test --release
